<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sanjeevani - Clinical Affective Intelligence Platform</title>

  <!-- Progressive Web App (PWA) Manifest & Apple Touch Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1d1f" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sanjeevani">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">

  <!-- Typography: Google Sans (Primary) & Inter (Secondary) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Google Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            inter: ['"Inter"', 'sans-serif'],
            mono: ['"SF Mono"', 'Menlo', 'monospace']
          },
          colors: {
            apple: {
              canvas: '#fbfbfd',
              card: '#ffffff',
              border: '#e5e5ea',
              subtle: '#8e8e93',
              dark: '#1d1d1f',
              accent: '#0071e3',
              emerald: '#059669',
              amber: '#d97706',
              rose: '#e11d48'
            },
            notion: {
              sidebar: '#f7f7f5',
              border: '#ececeb',
              hover: '#efefed',
              text: '#37352f',
              muted: '#787774'
            }
          },
          boxShadow: {
            'apple': '0 2px 8px -2px rgba(0, 0, 0, 0.04), 0 1px 4px -1px rgba(0, 0, 0, 0.02)',
            'apple-card': '0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02)',
            'apple-float': '0 12px 32px -4px rgba(0, 0, 0, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.03)'
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM, and Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Apple & Notion ultra-fine styling */
    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #fbfbfd;
      color: #1d1d1f;
      font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: manipulation;
    }
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #d1d1d6;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #8e8e93;
    }
    .thin-border {
      border: 1px solid rgba(0, 0, 0, 0.07);
    }
    .glass-nav {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    /* Apple iOS style bottom frosted glass tab bar */
    .apple-bottom-bar {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: saturate(180%) blur(24px);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
      border-top: 0.5px solid rgba(0, 0, 0, 0.1);
    }
    .safe-bottom-nav {
      padding-bottom: max(0.6rem, env(safe-area-inset-bottom));
    }
    .touch-target {
      min-height: 44px;
      min-width: 44px;
    }
    /* Hide scrollbar for horizontal chips */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Pulsing recording ring */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-record {
      animation: pulse-ring 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="h-full overflow-hidden select-none">
  <div id="root" class="h-full w-full"></div>

  <!-- React Application Source -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Minimalist Vector SVG Icons (No emojis anywhere) ---
    const Icons = {
      Logo: () => (
        <svg className="w-7 h-7 text-neutral-900" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="14" stroke="currentColor" strokeWidth="1.5" strokeOpacity="0.25" />
          <path d="M16 6C10.4772 6 6 10.4772 6 16C6 21.5228 10.4772 26 16 26" stroke="currentColor" strokeWidth="2" strokeLinecap="round" />
          <path d="M16 10C12.6863 10 10 12.6863 10 16C10 19.3137 12.6863 22 16 22C19.3137 22 22 19.3137 22 16" stroke="#059669" strokeWidth="2" strokeLinecap="round" />
          <circle cx="16" cy="16" r="3" fill="#059669" />
          <path d="M16 4V8M16 24V28M4 16H8M24 16H28" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeOpacity="0.3" />
        </svg>
      ),
      SessionCheck: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
          <path d="M8 9h8" />
          <path d="M8 13h6" />
        </svg>
      ),
      VoiceCheck: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <line x1="12" x2="12" y1="19" y2="22" />
        </svg>
      ),
      AskSanjeevani: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z" />
        </svg>
      ),
      Triage: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" />
          <path d="M12 8v4" />
          <path d="M12 16h.01" />
        </svg>
      ),
      Programs: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <rect width="7" height="9" x="3" y="3" rx="1" />
          <rect width="7" height="5" x="14" y="3" rx="1" />
          <rect width="7" height="9" x="14" y="12" rx="1" />
          <rect width="7" height="5" x="3" y="16" rx="1" />
        </svg>
      ),
      Soap: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" x2="8" y1="13" y2="13" />
          <line x1="16" x2="8" y1="17" y2="17" />
          <line x1="10" x2="8" y1="9" y2="9" />
        </svg>
      ),
      Upload: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" x2="12" y1="3" y2="15" />
        </svg>
      ),
      Play: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3" />
        </svg>
      ),
      Stop: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="currentColor">
          <rect width="14" height="14" x="5" y="5" rx="2" />
        </svg>
      ),
      Check: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      ),
      ChevronRight: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="9 18 15 12 9 6" />
        </svg>
      ),
      Send: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="22" x2="11" y1="2" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      ),
      Activity: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
        </svg>
      ),
      Search: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" x2="16.65" y1="21" y2="16.65" />
        </svg>
      )
    };

    // --- Main Unified Sanjeevani Application ---
    function SanjeevaniApp() {
      const [activeTab, setActiveTab] = useState("session"); // "session", "voice", "rag", "triage", "programs"
      const [backendHealthy, setBackendHealthy] = useState(false);
      const [activeScenario, setActiveScenario] = useState("Health Concern & Physical Exhaustion (Hindi / Hinglish)");
      const [scenariosList, setScenariosList] = useState([]);
      const [escalationCount, setEscalationCount] = useState(0);

      // Global Drag & Drop: prevent browser from opening dropped files in a new tab
      useEffect(() => {
        const preventFileNav = (e) => {
          e.preventDefault();
        };
        window.addEventListener("dragover", preventFileNav, false);
        window.addEventListener("drop", preventFileNav, false);
        return () => {
          window.removeEventListener("dragover", preventFileNav);
          window.removeEventListener("drop", preventFileNav);
        };
      }, []);

      // Check backend health on mount
      useEffect(() => {
        const apiBase = window.location.protocol === 'file:' ? 'http://localhost:8000' : '';
        fetch(apiBase + "/v1/health")
          .then(res => res.json())
          .then(data => {
            if (data.status === "healthy" || data.status === "ok") setBackendHealthy(true);
          })
          .catch(() => setBackendHealthy(false));

        fetch(apiBase + "/v1/analyze/scenarios")
          .then(res => res.json())
          .then(data => {
            if (data && data.scenarios) {
              setScenariosList(data.scenarios);
            }
          })
          .catch(() => {});
      }, []);

      return (
        <div className="flex h-full w-full bg-[#fbfbfd] text-neutral-900 font-sans">
          {/* Notion/Apple-Style Minimalist Left Sidebar (Desktop Only: >= 768px) */}
          <aside className="hidden md:flex w-[260px] flex-shrink-0 bg-[#f7f7f5] border-r border-[#ececeb] flex-col justify-between select-none">
            {/* Top Brand & Navigation */}
            <div className="p-4">
              {/* Brand Logo & Title */}
              <div className="flex items-center gap-3 px-2 py-2 mb-6">
                <Icons.Logo />
                <div>
                  <div className="font-semibold text-sm tracking-[0.16em] uppercase text-neutral-900 font-sans">
                    Sanjeevani
                  </div>
                  <div className="text-[10px] font-medium tracking-[0.08em] text-neutral-400 font-inter uppercase">
                    Affective Intelligence
                  </div>
                </div>
              </div>

              {/* Navigation Items */}
              <div className="space-y-1">
                <div className="px-2.5 pb-1.5 text-[11px] font-semibold uppercase tracking-wider text-neutral-400 font-inter">
                  Consultation
                </div>

                <button
                  onClick={() => setActiveTab("session")}
                  className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium transition-all ${
                    activeTab === "session"
                      ? "bg-white text-neutral-900 shadow-sm border border-neutral-200/60"
                      : "text-neutral-600 hover:bg-[#efefed] hover:text-neutral-900"
                  }`}
                >
                  <div className="flex items-center gap-2.5">
                    <Icons.SessionCheck className={`w-4 h-4 ${activeTab === "session" ? "text-emerald-600" : "text-neutral-500"}`} />
                    <span>Session Checkup</span>
                  </div>
                  {activeTab === "session" && <div className="w-1.5 h-1.5 rounded-full bg-emerald-600"></div>}
                </button>

                <button
                  onClick={() => setActiveTab("voice")}
                  className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium transition-all ${
                    activeTab === "voice"
                      ? "bg-white text-neutral-900 shadow-sm border border-neutral-200/60"
                      : "text-neutral-600 hover:bg-[#efefed] hover:text-neutral-900"
                  }`}
                >
                  <div className="flex items-center gap-2.5">
                    <Icons.VoiceCheck className={`w-4 h-4 ${activeTab === "voice" ? "text-emerald-600" : "text-neutral-500"}`} />
                    <span>Voice & Note Check</span>
                  </div>
                  {activeTab === "voice" && <div className="w-1.5 h-1.5 rounded-full bg-emerald-600"></div>}
                </button>

                <div className="pt-4 px-2.5 pb-1.5 text-[11px] font-semibold uppercase tracking-wider text-neutral-400 font-inter">
                  Clinical Care
                </div>

                <button
                  onClick={() => setActiveTab("rag")}
                  className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium transition-all ${
                    activeTab === "rag"
                      ? "bg-white text-neutral-900 shadow-sm border border-neutral-200/60"
                      : "text-neutral-600 hover:bg-[#efefed] hover:text-neutral-900"
                  }`}
                >
                  <div className="flex items-center gap-2.5">
                    <Icons.AskSanjeevani className={`w-4 h-4 ${activeTab === "rag" ? "text-emerald-600" : "text-neutral-500"}`} />
                    <span>Ask Sanjeevani</span>
                  </div>
                  {activeTab === "rag" && <div className="w-1.5 h-1.5 rounded-full bg-emerald-600"></div>}
                </button>

                <button
                  onClick={() => {
                    setActiveTab("triage");
                    setEscalationCount(0);
                  }}
                  className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium transition-all ${
                    activeTab === "triage"
                      ? "bg-white text-neutral-900 shadow-sm border border-neutral-200/60"
                      : "text-neutral-600 hover:bg-[#efefed] hover:text-neutral-900"
                  }`}
                >
                  <div className="flex items-center gap-2.5">
                    <Icons.Triage className={`w-4 h-4 ${activeTab === "triage" ? "text-emerald-600" : "text-neutral-500"}`} />
                    <span>Counsellor Triage</span>
                  </div>
                  {escalationCount > 0 ? (
                    <span className="px-2 py-0.5 text-[10px] font-bold rounded-full bg-rose-600 text-white animate-pulse">
                      {escalationCount} New
                    </span>
                  ) : (activeTab === "triage" && <div className="w-1.5 h-1.5 rounded-full bg-emerald-600"></div>)}
                </button>

                <button
                  onClick={() => setActiveTab("programs")}
                  className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium transition-all ${
                    activeTab === "programs"
                      ? "bg-white text-neutral-900 shadow-sm border border-neutral-200/60"
                      : "text-neutral-600 hover:bg-[#efefed] hover:text-neutral-900"
                  }`}
                >
                  <div className="flex items-center gap-2.5">
                    <Icons.Programs className={`w-4 h-4 ${activeTab === "programs" ? "text-emerald-600" : "text-neutral-500"}`} />
                    <span>Support Programs</span>
                  </div>
                  {activeTab === "programs" && <div className="w-1.5 h-1.5 rounded-full bg-emerald-600"></div>}
                </button>
              </div>
            </div>

            {/* Bottom Status & System Info */}
            <div className="p-4 border-t border-[#ececeb] space-y-2">
              <div className="flex items-center justify-between text-xs px-2 text-neutral-500 font-inter">
                <span>FastAPI Engine</span>
                <span className="flex items-center gap-1.5">
                  <span className={`w-2 h-2 rounded-full ${backendHealthy ? "bg-emerald-500" : "bg-emerald-400 animate-pulse"}`}></span>
                  <span className="font-medium text-[11px]">{backendHealthy ? "Active :8000" : "Connecting..."}</span>
                </span>
              </div>
              <div className="bg-white/80 border border-neutral-200/60 rounded-lg p-2.5 text-[11px] text-neutral-500 space-y-1 font-inter">
                <div className="flex justify-between">
                  <span>Whisper ASR:</span>
                  <span className="font-semibold text-neutral-700">OpenAI Base</span>
                </div>
                <div className="flex justify-between">
                  <span>AudEERING SER:</span>
                  <span className="font-semibold text-neutral-700">Wav2Vec2 ft</span>
                </div>
                <div className="flex justify-between">
                  <span>Affect Matrix:</span>
                  <span className="font-semibold text-neutral-700">PANAS-20</span>
                </div>
              </div>
            </div>
          </aside>

          {/* Main Viewport Container */}
          <main className="flex-1 flex flex-col h-full overflow-hidden bg-[#fbfbfd] relative">
            {/* Top Bar: Adaptive Mobile & Desktop */}
            <header className="h-14 border-b border-[#e5e5ea] bg-white/80 backdrop-blur-xl px-4 md:px-8 flex items-center justify-between flex-shrink-0 z-20 sticky top-0">
              <div className="flex items-center gap-2.5">
                {/* Mobile Brand (Shown on Mobile only) */}
                <div className="flex md:hidden items-center gap-2">
                  <Icons.Logo />
                  <div>
                    <span className="font-semibold text-sm tracking-[0.12em] uppercase text-neutral-900 font-sans block leading-tight">
                      Sanjeevani
                    </span>
                  </div>
                  <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-50 text-[10px] font-semibold text-emerald-700 border border-emerald-200/50">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-600 animate-pulse"></span>
                    AI Active
                  </span>
                </div>

                {/* Desktop Breadcrumbs (Hidden on Mobile) */}
                <div className="hidden md:flex items-center gap-2 text-sm text-neutral-500">
                  <span className="font-medium text-neutral-900">
                    {activeTab === "session" && "Full Conversation Checkup (Session Analyzer)"}
                    {activeTab === "voice" && "Single Message or Voice Note Check"}
                    {activeTab === "rag" && "Ask Sanjeevani - Conversational Oncology Assistant"}
                    {activeTab === "triage" && "Counsellor Triage & Escalation Dashboard"}
                    {activeTab === "programs" && "Sanjeevani Verified Oncology Programs"}
                  </span>
                  <span className="text-neutral-300">/</span>
                  <span className="text-xs text-neutral-400">Clinical Affective Engine</span>
                </div>
              </div>

              {/* Emergency Helpline Badge */}
              <div className="flex items-center gap-2">
                <a
                  href="tel:8691000800"
                  className="flex items-center gap-1.5 text-xs font-inter font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200/60 px-2.5 py-1 rounded-full hover:bg-emerald-100 active:scale-95 transition"
                  title="24/7 CanSupport National Helpline"
                >
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                  <span className="hidden sm:inline">Helpline:</span>
                  <span>8691000800</span>
                </a>
              </div>
            </header>

            {/* Scrollable Workspace Content with generous padding above mobile tab bar */}
            <div className="flex-1 overflow-y-auto px-3.5 py-4 sm:px-6 md:px-8 md:py-6 pb-28 md:pb-8 overscroll-contain">
              {activeTab === "session" && (
                <SessionCheckupView
                  scenariosList={scenariosList}
                  activeScenario={activeScenario}
                  setActiveScenario={setActiveScenario}
                />
              )}
              {activeTab === "voice" && <SingleVoiceCheckView />}
              {activeTab === "rag" && (
                <AskSanjeevaniView
                  setActiveTab={setActiveTab}
                  onEscalate={() => setEscalationCount(c => c + 1)}
                />
              )}
              {activeTab === "triage" && <CounsellorTriageView />}
              {activeTab === "programs" && <ProgramsExplorerView />}
            </div>

            {/* Apple / Notion Classic Bottom Tab Bar (Visible on Mobile only: < 768px) */}
            <nav className="md:hidden fixed bottom-0 left-0 right-0 z-50 apple-bottom-bar safe-bottom-nav px-2 pt-1.5 flex justify-around items-center select-none shadow-[0_-4px_24px_rgba(0,0,0,0.04)]">
              {[
                { id: "session", label: "Checkup", icon: Icons.SessionCheck },
                { id: "voice", label: "Voice", icon: Icons.VoiceCheck },
                { id: "rag", label: "Ask AI", icon: Icons.AskSanjeevani },
                { id: "triage", label: "Triage", icon: Icons.Triage },

    // ==============================================================================
    // AUDIO UTILITIES: PCM 16-BIT MONO RIFF WAV RECORDER (NO FFMPEG DEPENDENCY)
    // ==============================================================================
    function encodeWAV(samples, sampleRate) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);

      function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM format
      view.setUint16(22, 1, true); // Mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true); // Byte rate
      view.setUint16(32, 2, true); // Block align
      view.setUint16(34, 16, true); // Bits per sample
      writeString(view, 36, 'data');
      view.setUint32(40, samples.length * 2, true);

      let offset = 44;
      for (let i = 0; i < samples.length; i++) {
        let s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        offset += 2;
      }

      return new Blob([view], { type: 'audio/wav' });
    }

    class BrowserAudioRecorder {
      constructor() {
        this.stream = null;
        this.audioCtx = null;
        this.processor = null;
        this.source = null;
        this.chunks = [];
        this.sampleRate = 16000;
        this.isRecording = false;
      }

      async start() {
        this.chunks = [];
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("Microphone API is not supported in this browser environment.");
        }

        this.stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            channelCount: 1,
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        this.audioCtx = new AudioContextClass();
        this.sampleRate = this.audioCtx.sampleRate;
        this.source = this.audioCtx.createMediaStreamSource(this.stream);

        this.processor = this.audioCtx.createScriptProcessor(4096, 1, 1);
        this.processor.onaudioprocess = (e) => {
          if (!this.isRecording) return;
          const input = e.inputBuffer.getChannelData(0);
          this.chunks.push(new Float32Array(input));
        };

        this.source.connect(this.processor);
        this.processor.connect(this.audioCtx.destination);
        this.isRecording = true;
      }

      async stop() {
        this.isRecording = false;
        if (this.processor) {
          try { this.processor.disconnect(); } catch (e) {}
          this.processor = null;
        }
        if (this.source) {
          try { this.source.disconnect(); } catch (e) {}
          this.source = null;
        }
        if (this.audioCtx && this.audioCtx.state !== 'closed') {
          try { await this.audioCtx.close(); } catch (e) {}
          this.audioCtx = null;
        }
        if (this.stream) {
          try { this.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
          this.stream = null;
        }

        let totalLen = 0;
        for (const c of this.chunks) totalLen += c.length;
        if (totalLen === 0) {
          throw new Error("No audio was captured. Please check microphone and try speaking again.");
        }

        const merged = new Float32Array(totalLen);
        let offset = 0;
        for (const c of this.chunks) {
          merged.set(c, offset);
          offset += c.length;
        }

        let finalSamples = merged;
        let finalRate = this.sampleRate;
        if (this.sampleRate > 16000) {
          const targetRate = 16000;
          const ratio = this.sampleRate / targetRate;
          const newLen = Math.round(merged.length / ratio);
          const downsampled = new Float32Array(newLen);
          for (let i = 0; i < newLen; i++) {
            const srcIdx = Math.floor(i * ratio);
            downsampled[i] = merged[srcIdx] || 0;
          }
          finalSamples = downsampled;
          finalRate = targetRate;
        }

        return encodeWAV(finalSamples, finalRate);
      }
    }

    function formatAudioTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // ==============================================================================
    // VIEW 1: FULL CONVERSATION CHECKUP (SESSION ANALYZER)
    // ==============================================================================
    function SessionCheckupView({ scenariosList, activeScenario, setActiveScenario }) {
      const [audioFile, setAudioFile] = useState(null);
      const [audioPreviewUrl, setAudioPreviewUrl] = useState(null);
      const [audioMode, setAudioMode] = useState("file"); // "file" or "record"
      const [isDragging, setIsDragging] = useState(false);
      const [isRecording, setIsRecording] = useState(false);
      const [recordingTime, setRecordingTime] = useState(0);
      const [micError, setMicError] = useState(null);
      const [language, setLanguage] = useState("auto");
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [error, setError] = useState(null);

      const fileInputRef = useRef(null);
      const recorderRef = useRef(null);
      const timerRef = useRef(null);

      // Clean up object URLs on unmount
      useEffect(() => {
        return () => {
          if (audioPreviewUrl) URL.revokeObjectURL(audioPreviewUrl);
          if (timerRef.current) clearInterval(timerRef.current);
          if (recorderRef.current && recorderRef.current.isRecording) {
            recorderRef.current.stop().catch(() => {});
          }
        };
      }, [audioPreviewUrl]);

      const handleAudioSelected = (file) => {
        if (!file) return;
        if (audioPreviewUrl) URL.revokeObjectURL(audioPreviewUrl);
        setAudioFile(file);
        setAudioPreviewUrl(URL.createObjectURL(file));
        setMicError(null);
      };

      const handleClearAudio = (e) => {
        if (e) e.stopPropagation();
        if (audioPreviewUrl) URL.revokeObjectURL(audioPreviewUrl);
        setAudioFile(null);
        setAudioPreviewUrl(null);
        setRecordingTime(0);
        setMicError(null);
      };

      const startRecording = async () => {
        setMicError(null);
        try {
          if (!recorderRef.current) {
            recorderRef.current = new BrowserAudioRecorder();
          }
          await recorderRef.current.start();
          setIsRecording(true);
          setRecordingTime(0);

          if (timerRef.current) clearInterval(timerRef.current);
          timerRef.current = setInterval(() => {
            setRecordingTime(prev => prev + 1);
          }, 1000);
        } catch (err) {
          if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
            setMicError("Microphone permission was denied. Please allow microphone access in your browser's address bar and try again.");
          } else {
            setMicError("Could not access microphone: " + (err.message || err.name));
          }
          setIsRecording(false);
        }
      };

      const stopRecording = async () => {
        if (!recorderRef.current || !isRecording) return;
        if (timerRef.current) clearInterval(timerRef.current);
        setIsRecording(false);
        try {
          const wavBlob = await recorderRef.current.stop();
          const recordedFile = new File([wavBlob], `consultation_recording_${Date.now()}.wav`, { type: "audio/wav" });
          handleAudioSelected(recordedFile);
        } catch (err) {
          setMicError("Failed to save audio recording: " + err.message);
        }

      const runAnalysis = async () => {
        setLoading(true);
        setError(null);
        try {
          const formData = new FormData();
          if (audioFile) {
            formData.append("file", audioFile);
          } else {
            formData.append("scenario", activeScenario);
          }
          formData.append("language", language);

          const res = await fetch("/v1/analyze/consultation", {
            method: "POST",
            body: formData
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.detail || "Consultation evaluation failed");
          }

          const data = await res.json();
          setResult(data);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

          {/* Header Card */}

              <div>
                <h1 className="text-lg sm:text-xl font-semibold text-neutral-900 tracking-tight">
                  Full Consultation Checkup & Dialogue Timeline

                  Upload recorded doctor-patient audio, drop an audio file, or record live through your browser microphone for continuous prosodic tracking.

              <span className="self-start text-[11px] sm:text-xs font-inter font-medium px-2.5 py-1 rounded-full bg-neutral-100 text-neutral-600 border border-neutral-200 whitespace-nowrap">
                Multi-Turn Diagnostic Mode

                    onDragLeave={(e) => { e.preventDefault(); e.stopPropagation(); setIsDragging(false); }}
                    onDrop={(e) => {
                      e.preventDefault();
                      e.stopPropagation();
                      setIsDragging(false);
                      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                        handleAudioSelected(e.dataTransfer.files[0]);

                    <input

                        if (e.target.files && e.target.files[0]) {
                          handleAudioSelected(e.target.files[0]);

                    <Icons.Upload className={`w-6 h-6 mx-auto mb-1.5 ${audioFile ? "text-emerald-600" : "text-neutral-400"}`} />
                    <div className="text-sm font-medium text-neutral-800 truncate px-2">

                    <div className="text-xs text-neutral-400 font-inter mt-0.5">
                      {audioFile

                    {audioFile && audioPreviewUrl && (
                      <div className="mt-3 pt-2 border-t border-emerald-200/60" onClick={e => e.stopPropagation()}>
                        <audio controls src={audioPreviewUrl} className="w-full h-8 max-h-8" />
                        <div className="flex justify-end mt-1.5">
                          <button

                            className="text-xs text-rose-600 hover:underline font-inter font-medium"
                          >
                            Remove / Replace Audio
                          </button>
                        </div>
                      </div>
                    )}
                  </div>

                {/* Sub-mode 2: Live Mic Recording */}
                {audioMode === "record" && (
                  <div className="border border-neutral-200 rounded-xl p-4 text-center bg-neutral-50/40 flex flex-col items-center justify-center space-y-3 min-h-[140px]">
                    {micError && (
                      <div className="w-full text-xs text-rose-600 bg-rose-50 border border-rose-200 p-2.5 rounded-lg text-left font-inter">
                        {micError}
                      </div>

                    {!isRecording && !audioFile && (
                      <>
                        <button
                          type="button"
                          onClick={startRecording}
                          className="w-14 h-14 rounded-full bg-rose-600 hover:bg-rose-700 text-white flex items-center justify-center shadow-apple transition-transform hover:scale-105 active:scale-95"

                          <Icons.VoiceCheck className="w-6 h-6 text-white" />
                        </button>
                        <div>
                          <div className="text-sm font-medium text-neutral-800">
                            Click to record consultation audio
                          </div>
                          <div className="text-xs text-neutral-400 font-inter mt-0.5">
                            Browser will ask for microphone permission. Speak clearly.
                          </div>
                        </div>
                      </>

                    {isRecording && (
                      <>
                        <div className="relative">
                          <div className="absolute inset-0 rounded-full bg-rose-400 pulse-record"></div>

                          <audio controls src={audioPreviewUrl} className="w-full h-8" />

                            className="text-xs text-rose-600 hover:underline font-inter font-medium"

                            Remove Recording
                          </button>

                      </div>

                  </div>

                <select
