                </div>

                {/* Card 3: Triage Priority */}
                <div className="bg-white border border-neutral-200/70 rounded-xl p-4 shadow-apple">
                  <div className="text-xs font-inter text-neutral-400 uppercase font-medium">Triage Priority</div>
                  <div className="text-base font-semibold text-neutral-900 mt-2 truncate">
                    {result.urgency_category || `Level ${result.triage_level}`}
                  </div>
                  <div className="text-xs text-neutral-500 mt-1 font-inter">
                    Level {result.triage_level} Actionable Protocol
                  </div>
                </div>

                {/* Card 4: Dialogue Turns */}
                <div className="bg-white border border-neutral-200/70 rounded-xl p-4 shadow-apple">
                  <div className="text-xs font-inter text-neutral-400 uppercase font-medium">Dialogue Turns</div>
                  <div className="text-3xl font-bold text-neutral-900 mt-1">
                    {result.turn_count || (result.evaluated_turns ? result.evaluated_turns.length : 0)}
                  </div>
                  <div className="text-xs text-neutral-500 mt-1 font-inter">
                    Duration: {result.total_duration}s
                  </div>
                </div>
              </div>

              {/* Mood Trajectory Curve */}
              {result.svg_html && (
                <div className="bg-white border border-neutral-200/70 rounded-2xl p-6 shadow-apple space-y-3">
                  <div className="flex items-center justify-between">
                    <h3 className="text-sm font-semibold uppercase tracking-wider text-neutral-700 font-inter">
                      Affective Mood Trajectory & Distress Curve
                    </h3>
                    <span className="text-xs text-neutral-400 font-inter">Synchronized over timeline</span>
                  </div>
                  <div
                    className="w-full overflow-x-auto flex justify-center py-2"
                    dangerouslySetInnerHTML={{ __html: result.svg_html }}
                  />
                </div>
              )}

              {/* Synchronized Turn Cards */}
              <div className="bg-white border border-neutral-200/70 rounded-2xl p-6 shadow-apple space-y-4">
                <div className="flex items-center justify-between border-b border-neutral-100 pb-3">
                  <h3 className="text-sm font-semibold uppercase tracking-wider text-neutral-700 font-inter">
                    Synchronized Dialogue Transcript & Acoustic Biomarkers
                  </h3>
                  <span className="text-xs text-neutral-400 font-inter">
                    {result.evaluated_turns ? result.evaluated_turns.length : 0} Turns Processed
                  </span>
                </div>

                <div className="space-y-3">
                  {result.evaluated_turns && result.evaluated_turns.map((turn, idx) => (
                    <div
                      key={idx}
                      className="border border-neutral-200/70 rounded-xl p-4 hover:border-neutral-300 transition bg-neutral-50/30 space-y-2"
                    >
                      <div className="flex items-center justify-between text-xs">
                        <div className="flex items-center gap-2">
                          <span className="font-semibold text-neutral-800 bg-neutral-200/70 px-2 py-0.5 rounded font-inter">
                            Turn #{turn.turn_num || idx + 1}
                          </span>
                          <span className="text-neutral-400 font-inter font-mono">
                            {turn.timestamp || `${turn.start}s - ${turn.end}s`}
                          </span>
                        </div>
                        <div className="flex items-center gap-2">
                          {turn.vocal_status && (
                            <span dangerouslySetInnerHTML={{ __html: turn.vocal_status }} />
                          )}
                          <span className="font-bold text-neutral-700 bg-white border border-neutral-200 px-2 py-0.5 rounded text-[11px] font-inter">
                            EDS: {turn.turn_eds !== undefined ? turn.turn_eds : (turn.distress !== undefined ? turn.distress : 0)}%
                          </span>
                        </div>
                      </div>

                      <div className="text-sm text-neutral-900 font-sans leading-relaxed">
                        {turn.text}
                      </div>

                      {turn.prosody && (
                        <div className="flex flex-wrap items-center gap-3 pt-1 text-[11px] text-neutral-500 font-inter border-t border-neutral-100 mt-2">
                          <span>Pitch F0: <b className="text-neutral-700">{turn.prosody.f0_mean_hz ? turn.prosody.f0_mean_hz.toFixed(1) : 140.0} Hz</b> (±{turn.prosody.f0_std_hz ? turn.prosody.f0_std_hz.toFixed(1) : 10.0} Hz)</span>
                          <span>RMS Volume: <b className="text-neutral-700">{turn.prosody.rms_mean ? turn.prosody.rms_mean.toFixed(3) : 0.04}</b></span>
                          <span>ZCR Frication: <b className="text-neutral-700">{turn.prosody.zcr_mean ? turn.prosody.zcr_mean.toFixed(3) : 0.04}</b></span>
                          <span>Tremor Proxy: <b className="text-neutral-700">{turn.prosody.jitter_proxy ? turn.prosody.jitter_proxy.toFixed(3) : 0.015}</b></span>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>

              {/* Counselor Action Plan */}
              {result.counselor_plan && (
                <div className="bg-white border border-neutral-200/70 rounded-2xl p-6 shadow-apple space-y-3">
                  <h3 className="text-sm font-semibold uppercase tracking-wider text-emerald-800 font-inter">
                    Clinical Counselor Guidance & Action Plan
                  </h3>
                  <div className="prose prose-sm max-w-none text-neutral-700 font-sans whitespace-pre-wrap leading-relaxed">
                    {result.counselor_plan}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==============================================================================
    // VIEW 2: SINGLE MESSAGE OR VOICE NOTE CHECK
    // ==============================================================================
    function SingleVoiceCheckView() {
      const [inputMode, setInputMode] = useState("mic"); // "mic", "file", "text"
      const [textInput, setTextInput] = useState("");
      const [audioFile, setAudioFile] = useState(null);
      const [audioPreviewUrl, setAudioPreviewUrl] = useState(null);
      const [isDragging, setIsDragging] = useState(false);
      const [isRecording, setIsRecording] = useState(false);
      const [recordingTime, setRecordingTime] = useState(0);
      const [recordedBlob, setRecordedBlob] = useState(null);
      const [recordedBlobUrl, setRecordedBlobUrl] = useState(null);
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [error, setError] = useState(null);

      const recorderRef = useRef(null);
      const timerIntervalRef = useRef(null);
      const fileInputRef = useRef(null);

      // Clean up object URLs on unmount
      useEffect(() => {
        return () => {
          if (audioPreviewUrl) URL.revokeObjectURL(audioPreviewUrl);
          if (recordedBlobUrl) URL.revokeObjectURL(recordedBlobUrl);
          if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);
          if (recorderRef.current && recorderRef.current.isRecording) {
            recorderRef.current.stop().catch(() => {});
          }
        };
      }, [audioPreviewUrl, recordedBlobUrl]);

      // Start live mic recording
      const startRecording = async () => {
        setError(null);
        try {
          if (!recorderRef.current) {
            recorderRef.current = new BrowserAudioRecorder();
          }
          await recorderRef.current.start();
          setIsRecording(true);
          setRecordingTime(0);

          if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);
          timerIntervalRef.current = setInterval(() => {
            setRecordingTime(prev => prev + 1);
          }, 1000);
        } catch (err) {
          if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
            setError("Microphone permission was denied. Please allow microphone access in your browser's address bar and try again.");
          } else {
            setError("Microphone access error: " + (err.message || err.name));
          }
          setIsRecording(false);
        }
      };

      // Stop live mic recording
      const stopRecording = async () => {
        if (!recorderRef.current || !isRecording) return;
        if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);
        setIsRecording(false);
        try {
          const wavBlob = await recorderRef.current.stop();
          if (recordedBlobUrl) URL.revokeObjectURL(recordedBlobUrl);
          setRecordedBlob(wavBlob);
          setRecordedBlobUrl(URL.createObjectURL(wavBlob));
        } catch (err) {
          setError("Failed to process recorded audio: " + err.message);
        }
      };

      // Submit checkup
      const analyzeSingle = async () => {
        setLoading(true);
        setError(null);
        try {
          if (inputMode === "text") {
            if (!textInput.trim()) throw new Error("Please enter text message to evaluate.");
            const res = await fetch("/v1/analyze/text", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ text: textInput, language: "auto" })
            });
            if (!res.ok) throw new Error("Text analysis failed");
            const data = await res.json();
            setResult({ isText: true, ...data });
          } else {
            const fileToUpload = inputMode === "mic" ? recordedBlob : audioFile;
            if (!fileToUpload) throw new Error("Please record audio or upload an audio file.");
            
            const formData = new FormData();
            formData.append("file", fileToUpload, "recording.wav");
            formData.append("language", "auto");

            const res = await fetch("/v1/analyze/audio", {
              method: "POST",
              body: formData
            });

            if (!res.ok) {
              const errData = await res.json().catch(() => ({}));
              throw new Error(errData.detail || "Audio analysis failed");
            }

            const data = await res.json();
            setResult({ isText: false, ...data });
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="max-w-5xl mx-auto space-y-6">
          {/* Header Card */}
          <div className="bg-white border border-neutral-200/70 rounded-2xl p-4 sm:p-6 shadow-apple space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
              <div>
                <h1 className="text-lg sm:text-xl font-semibold text-neutral-900 tracking-tight">
                  Single Message or Voice Note Check
                </h1>
                <p className="text-xs sm:text-sm text-neutral-500 font-inter mt-1 leading-relaxed">
                  Instant affective screening for spoken audio clips or text notes. Computes PANAS-20 affect, continuous VAD, and Section 8 EDS score.
                </p>
              </div>
              <div className="flex w-full sm:w-auto bg-neutral-100 p-1 rounded-xl border border-neutral-200 text-xs font-inter font-medium self-start">
                <button
                  onClick={() => setInputMode("mic")}
                  className={`flex-1 sm:flex-none px-3 py-1.5 rounded-lg transition active:scale-95 ${inputMode === "mic" ? "bg-white text-neutral-900 shadow-sm" : "text-neutral-500 hover:text-neutral-900"}`}
                >
                  Live Mic
                </button>
                <button
                  onClick={() => setInputMode("file")}
                  className={`flex-1 sm:flex-none px-3 py-1.5 rounded-lg transition active:scale-95 ${inputMode === "file" ? "bg-white text-neutral-900 shadow-sm" : "text-neutral-500 hover:text-neutral-900"}`}
                >
                  Upload Audio
                </button>
                <button
                  onClick={() => setInputMode("text")}
                  className={`flex-1 sm:flex-none px-3 py-1.5 rounded-lg transition active:scale-95 ${inputMode === "text" ? "bg-white text-neutral-900 shadow-sm" : "text-neutral-500 hover:text-neutral-900"}`}
                >
                  Text Message
                </button>
              </div>
            </div>

            {/* Input Container */}
            <div className="pt-2">
              {inputMode === "mic" && (
                <div className="border border-neutral-200 rounded-xl p-8 text-center bg-neutral-50/40 flex flex-col items-center justify-center space-y-4">
                  <div className="relative">
                    {isRecording && <div className="absolute inset-0 rounded-full bg-rose-400 pulse-record"></div>}
                    <button
                      onClick={isRecording ? stopRecording : startRecording}
                      className={`relative z-10 w-16 h-16 rounded-full flex items-center justify-center transition shadow-apple ${
                        isRecording ? "bg-rose-600 text-white" : "bg-neutral-900 text-white hover:bg-neutral-800"
                      }`}
                    >
                      {isRecording ? <Icons.Stop className="w-6 h-6" /> : <Icons.VoiceCheck className="w-6 h-6" />}
                    </button>
                  </div>
                  <div>
                    <div className="text-sm font-semibold text-neutral-800">
                      {isRecording ? "Recording audio live..." : (recordedBlob ? "Recording ready for checkup" : "Click microphone to start recording")}
                    </div>
                    <div className="text-xs text-neutral-400 font-inter mt-1 font-mono">
                      {isRecording ? `00:${recordingTime < 10 ? "0" : ""}${recordingTime}` : (recordedBlob ? "Audio captured successfully" : "Speak naturally for 5–20 seconds")}
                    </div>
                  </div>
                  {recordedBlob && recordedBlobUrl && (
                    <div className="flex flex-col items-center gap-2">
                      <audio controls src={recordedBlobUrl} className="h-8 max-w-xs mt-2" />
                      <button
                        type="button"
                        onClick={() => {
                          if (recordedBlobUrl) URL.revokeObjectURL(recordedBlobUrl);
                          setRecordedBlob(null);
                          setRecordedBlobUrl(null);
                        }}
                        className="text-xs text-rose-600 hover:underline font-inter"
                      >
                        Clear recording
                      </button>
                    </div>
                  )}
                </div>
              )}

              {inputMode === "file" && (
                <div
                  onClick={() => fileInputRef.current && fileInputRef.current.click()}
                  onDragEnter={(e) => { e.preventDefault(); e.stopPropagation(); setIsDragging(true); }}
                  onDragOver={(e) => { e.preventDefault(); e.stopPropagation(); setIsDragging(true); }}
                  onDragLeave={(e) => { e.preventDefault(); e.stopPropagation(); setIsDragging(false); }}
                  onDrop={(e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    setIsDragging(false);
                    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                      const file = e.dataTransfer.files[0];
                      if (audioPreviewUrl) URL.revokeObjectURL(audioPreviewUrl);
                      setAudioFile(file);
                      setAudioPreviewUrl(URL.createObjectURL(file));
                    }
                  }}
                  className={`border-2 border-dashed rounded-xl p-6 text-center cursor-pointer transition ${
                    isDragging
                      ? "border-emerald-500 bg-emerald-50/70 ring-4 ring-emerald-500/20 scale-[1.01]"
                      : audioFile
                        ? "border-emerald-500 bg-emerald-50/30"
                        : "border-neutral-200 hover:border-neutral-300 bg-neutral-50/50"
                  }`}
                >
                  <input
                    type="file"
                    ref={fileInputRef}
                    className="hidden"
                    accept="audio/*,.wav,.mp3,.ogg,.m4a,.flac"
                    onChange={e => {
                      if (e.target.files && e.target.files[0]) {
                        const file = e.target.files[0];
                        if (audioPreviewUrl) URL.revokeObjectURL(audioPreviewUrl);
                        setAudioFile(file);
                        setAudioPreviewUrl(URL.createObjectURL(file));
                      }
                    }}
                  />
                  <Icons.Upload className={`w-6 h-6 mx-auto mb-2 ${audioFile ? "text-emerald-600" : "text-neutral-400"}`} />
                  <div className="text-sm font-medium text-neutral-800">
                    {isDragging ? "Drop your audio file here!" : (audioFile ? audioFile.name : "Choose or drop audio note file")}
                  </div>
                  <div className="text-xs text-neutral-400 font-inter mt-1">
                    {audioFile ? `${(audioFile.size / 1024).toFixed(1)} KB • Ready for checkup` : "Supports WAV, MP3, M4A, OGG up to 25 MB (drag & drop)"}
                  </div>
                  {audioFile && audioPreviewUrl && (
                    <div className="mt-3 pt-2 border-t border-emerald-200/50" onClick={e => e.stopPropagation()}>
                      <audio controls src={audioPreviewUrl} className="h-8 max-w-xs mx-auto" />
                      <button
                        type="button"
                        onClick={(e) => {
                          e.stopPropagation();
                          if (audioPreviewUrl) URL.revokeObjectURL(audioPreviewUrl);
                          setAudioFile(null);
                          setAudioPreviewUrl(null);
                        }}
                        className="mt-2 text-xs text-rose-600 hover:underline font-inter"
                      >
                        Remove file
                      </button>
                    </div>
                  )}
                </div>
              )}

              {inputMode === "text" && (
                <textarea
                  rows="3"
                  value={textInput}
                  onChange={e => setTextInput(e.target.value)}
                  placeholder="Enter patient note or message (e.g., 'Aaj subah final interview round ka result email aaya hai, mai bohot khush hu!')..."
                  className="w-full text-sm border border-neutral-200 rounded-xl p-3.5 focus:outline-none focus:border-neutral-400 transition font-sans"
                />
              )}
            </div>

            {/* Submit Button */}
            <div className="flex justify-end pt-2">
              <button
                onClick={analyzeSingle}
                disabled={loading || (inputMode === "mic" && !recordedBlob) || (inputMode === "file" && !audioFile) || (inputMode === "text" && !textInput.trim())}
                className="w-full sm:w-auto inline-flex justify-center items-center gap-2 px-6 py-3 rounded-xl bg-neutral-900 text-white font-medium text-sm hover:bg-neutral-800 active:scale-98 transition disabled:opacity-40 shadow-sm"
              >
                {loading ? (
                  <>
                    <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                    <span>Evaluating Affect...</span>
                  </>
                ) : (
                  <>
                    <Icons.Activity className="w-3.5 h-3.5" />
                    <span>Evaluate Voice & Affect</span>
                  </>
                )}
              </button>
            </div>
          </div>

          {/* Error */}
          {error && (
            <div className="p-4 bg-rose-50 border border-rose-200 rounded-xl text-rose-800 text-sm font-inter">
              {error}
            </div>
          )}

          {/* Output Presentation */}
          {result && (
            <div className="space-y-6">
              {/* Primary Emotion Hero Card */}
              {result.primary_emotion && (
                <div
                  className="bg-white border rounded-2xl p-6 shadow-apple space-y-3"
                  style={{ borderColor: result.primary_emotion.color || "#059669" }}
                >
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-inter font-semibold uppercase tracking-wider text-neutral-400">
                      Primary Emotional State
                    </span>
                    <span
                      className="px-3 py-1 rounded-full text-xs font-bold font-inter"
                      style={{
                        backgroundColor: `${result.primary_emotion.color || "#059669"}15`,
                        color: result.primary_emotion.color || "#059669"
                      }}
                    >
                      {result.primary_emotion.label}
                    </span>
                  </div>

                  <div className="flex items-baseline gap-3">
                    <div className="text-4xl font-extrabold tracking-tight" style={{ color: result.primary_emotion.color }}>
                      {result.primary_emotion.score_pct}%
                    </div>
                    <div className="text-sm font-medium text-neutral-500 font-inter">
                      {result.primary_emotion.metric_name}
                    </div>
                  </div>

                  <div className="w-full bg-neutral-100 h-2 rounded-full overflow-hidden">
                    <div
                      className="h-full rounded-full transition-all duration-500"
                      style={{
                        width: `${result.primary_emotion.score_pct}%`,
                        backgroundColor: result.primary_emotion.color
                      }}
                    ></div>
                  </div>

                  <div className="text-sm text-neutral-700 font-sans pt-1">
                    <span className="font-semibold text-neutral-900">Actionable Guidance: </span>
                    {result.primary_emotion.action_guidance}
                  </div>
                </div>
              )}

              {/* Triage & EDS Summary */}
              {result.triage && (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-white border border-neutral-200/70 rounded-xl p-4 shadow-apple">
                    <div className="text-xs font-inter text-neutral-400 uppercase font-medium">Distress Score (EDS)</div>
                    <div className="text-3xl font-bold text-neutral-900 mt-1">
                      {result.triage.eds}%
                    </div>
                    <div className="text-xs text-neutral-500 font-inter mt-1">
                      Section 8 Emotional Distress Index
                    </div>
                  </div>

                  <div className="bg-white border border-neutral-200/70 rounded-xl p-4 shadow-apple">
                    <div className="text-xs font-inter text-neutral-400 uppercase font-medium">Triage Category</div>
                    <div className="text-base font-semibold text-neutral-900 mt-2 truncate">
                      {result.triage.category}
                    </div>
                    <div className="text-xs text-neutral-500 font-inter mt-1">
                      Level {result.triage.level} Protocol
                    </div>
                  </div>

                  <div className="bg-white border border-neutral-200/70 rounded-xl p-4 shadow-apple">
                    <div className="text-xs font-inter text-neutral-400 uppercase font-medium">Affect Sums</div>
                    <div className="flex items-center gap-4 mt-2">
                      <div>
                        <span className="text-xs text-emerald-700 font-semibold">Positive: </span>
                        <span className="text-base font-bold text-emerald-700">{result.pa_sum}/50</span>
                      </div>
                      <div>
                        <span className="text-xs text-rose-700 font-semibold">Negative: </span>
                        <span className="text-base font-bold text-rose-700">{result.na_sum}/50</span>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* Spoken Transcription (if audio) */}
              {result.transcription && result.transcription.transcript && (
                <div className="bg-white border border-neutral-200/70 rounded-2xl p-5 shadow-apple space-y-2">
                  <div className="text-xs font-inter text-neutral-400 uppercase font-medium">
                    Recognized Speech Transcription (Whisper ASR)
                  </div>
                  <div className="text-base font-medium text-neutral-900 font-sans">
                    "{result.transcription.transcript}"
                  </div>
                  {result.transcription.english_translation && (
                    <div className="text-xs text-neutral-500 font-inter">
                      Translation: {result.transcription.english_translation}
                    </div>
                  )}
                </div>
              )}

              {/* Acoustic Biomarkers & VAD (if audio) */}
              {result.biomarkers && (
                <div className="bg-white border border-neutral-200/70 rounded-2xl p-6 shadow-apple space-y-4">
                  <h3 className="text-sm font-semibold uppercase tracking-wider text-neutral-700 font-inter">
                    Handcrafted Acoustic Biomarkers & Continuous Affect
                  </h3>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-xs font-inter">
                    <div className="p-3 bg-neutral-50 rounded-lg border border-neutral-200/60">
                      <div className="text-neutral-400">Pitch F0 Mean</div>
                      <div className="text-base font-bold text-neutral-800 mt-1">{result.biomarkers.f0_mean_hz.toFixed(1)} Hz</div>
                      <div className="text-[10px] text-neutral-400">Std: ±{result.biomarkers.f0_std_hz.toFixed(1)} Hz</div>
                    </div>
                    <div className="p-3 bg-neutral-50 rounded-lg border border-neutral-200/60">
                      <div className="text-neutral-400">Energy (RMS)</div>
                      <div className="text-base font-bold text-neutral-800 mt-1">{result.biomarkers.rms_mean.toFixed(3)}</div>
                      <div className="text-[10px] text-neutral-400">Signal volume</div>
                    </div>
                    <div className="p-3 bg-neutral-50 rounded-lg border border-neutral-200/60">
                      <div className="text-neutral-400">Zero-Crossing Rate</div>
                      <div className="text-base font-bold text-neutral-800 mt-1">{result.biomarkers.zcr_mean.toFixed(3)}</div>
                      <div className="text-[10px] text-neutral-400">Breathiness / frication</div>
                    </div>
                    <div className="p-3 bg-neutral-50 rounded-lg border border-neutral-200/60">
                      <div className="text-neutral-400">Micro-Tremor Proxy</div>
                      <div className="text-base font-bold text-neutral-800 mt-1">{result.biomarkers.jitter_proxy.toFixed(3)}</div>
                      <div className="text-[10px] text-neutral-400">Autonomic shakiness</div>
                    </div>
                  </div>

                  {result.vad && (
                    <div className="pt-2 border-t border-neutral-100 flex items-center justify-between text-xs font-inter text-neutral-500">
                      <span>audEERING Continuous VAD:</span>
                      <div className="flex gap-4">
                        <span>Arousal: <b className="text-neutral-800">{result.vad.arousal.toFixed(2)}</b></span>
                        <span>Dominance: <b className="text-neutral-800">{result.vad.dominance.toFixed(2)}</b></span>
                        <span>Valence: <b className="text-neutral-800">{result.vad.valence.toFixed(2)}</b></span>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* Complete PANAS-20 Matrix */}
              {result.panas20_scores && (
                <div className="bg-white border border-neutral-200/70 rounded-2xl p-6 shadow-apple space-y-4">
                  <h3 className="text-sm font-semibold uppercase tracking-wider text-neutral-700 font-inter">
                    Complete PANAS-20 Matrix (20-Scale Full Emotional Profile)
                  </h3>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {/* Positive Affect */}
                    <div className="space-y-2.5">
                      <div className="text-xs font-bold text-emerald-800 uppercase tracking-wider font-inter mb-3">
                        10 Positive Affect Scales (सकारात्मक भावनाएं)
                      </div>
                      {["enthusiastic", "interested", "determined", "excited", "inspired", "alert", "active", "strong", "proud", "attentive"].map((item) => {
                        const val = result.panas20_scores[item] || 1.0;
                        const pct = Math.round(((val - 1.0) / 4.0) * 100);
                        return (
                          <div key={item} className="space-y-1">
                            <div className="flex justify-between text-xs font-inter">
                              <span className="capitalize font-medium text-neutral-700">{item}</span>
                              <span className="font-semibold text-emerald-700">{val.toFixed(1)} / 5.0 ({pct}%)</span>
                            </div>
                            <div className="w-full bg-neutral-100 h-1.5 rounded-full overflow-hidden">
                              <div className="bg-emerald-500 h-full rounded-full" style={{ width: `${pct}%` }}></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    {/* Negative Affect */}
                    <div className="space-y-2.5">
                      <div className="text-xs font-bold text-rose-800 uppercase tracking-wider font-inter mb-3">
                        10 Negative Affect Scales (नकारात्मक भावनाएं)
                      </div>
                      {["scared", "afraid", "upset", "distressed", "jittery", "nervous", "ashamed", "guilty", "hostile", "irritable"].map((item) => {
                        const val = result.panas20_scores[item] || 1.0;
                        const pct = Math.round(((val - 1.0) / 4.0) * 100);
                        return (
                          <div key={item} className="space-y-1">
                            <div className="flex justify-between text-xs font-inter">
                              <span className="capitalize font-medium text-neutral-700">{item}</span>
                              <span className="font-semibold text-rose-700">{val.toFixed(1)} / 5.0 ({pct}%)</span>
                            </div>
                            <div className="w-full bg-neutral-100 h-1.5 rounded-full overflow-hidden">
                              <div className="bg-rose-500 h-full rounded-full" style={{ width: `${pct}%` }}></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==============================================================================
    // VIEW 3: ASK SANJEEVANI (CONVERSATIONAL RAG & VOICE AI)
    // ==============================================================================
    function AskSanjeevaniView({ setActiveTab, onEscalate }) {
      const [messages, setMessages] = useState([
        {
          role: "assistant",
          text: "Namaste. I am Sanjeevani, your oncology and emotional wellness assistant. How may I support you or your family today?",
          sources: []
        }
      ]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const messagesEndRef = useRef(null);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages]);

      const sendMessage = async (userText) => {
        const queryText = userText || input;
        if (!queryText.trim()) return;

        const newMessages = [...messages, { role: "user", text: queryText }];
        setMessages(newMessages);
        setInput("");
        setLoading(true);

        try {
          const apiBase = window.location.protocol === 'file:' ? 'http://localhost:8000' : '';
          const res = await fetch(apiBase + "/v1/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: queryText, query: queryText, language: "auto" })
          });

          if (!res.ok) throw new Error("Chat service unavailable (" + res.status + ")");
          const data = await res.json();

          const replyText = data.answer || data.reply || "No response received.";
          const replySources = data.sources || (data.citations ? data.citations.map(c => c.source || c.title) : []);
          const replyEds = data.turn_eds !== undefined ? data.turn_eds : (data.running_eds !== undefined ? data.running_eds : 20.0);
          const isEsc = Boolean(data.is_escalated || replyEds > 60.0);
          const triageTier = data.triage_tier || (replyEds > 80 ? "Priority Review Required 🔴" : "Counsellor Attention Recommended 🟠");

          if (isEsc && onEscalate) {
            onEscalate();
          }

          setMessages([
            ...newMessages,
            {
              role: "assistant",
              text: replyText,
              sources: replySources,
              eds: replyEds,
              isEscalated: isEsc,
              triageTier: triageTier
            }
          ]);
        } catch (err) {
          setMessages([
            ...newMessages,
            {
              role: "assistant",
              text: "I apologize, but I encountered an error connecting to the clinical knowledge base. Please try asking again or contact our 24/7 helpline at 8691000800.",
              sources: []
            }
          ]);
        } finally {
          setLoading(false);
        }
      };

      const prompts = [
        "What are common side effects of chemotherapy?",
        "How can CanSupport help our family in Delhi?",
        "My mother feels very exhausted and scared after radiation. How can we support her?",
        "What nutrition guidelines should cancer patients follow?"
      ];

      return (
        <div className="max-w-4xl mx-auto h-[calc(100dvh-175px)] md:h-[calc(100vh-140px)] flex flex-col bg-white border border-neutral-200/70 rounded-2xl shadow-apple overflow-hidden">
          {/* Assistant Header */}
          <div className="px-4 sm:px-6 py-3 sm:py-4 border-b border-neutral-100 flex items-center justify-between bg-neutral-50/50 flex-shrink-0">
            <div className="flex items-center gap-2.5 sm:gap-3">
              <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-emerald-600/10 text-emerald-700 flex items-center justify-center font-bold text-sm">
                <Icons.AskSanjeevani className="w-4 h-4 sm:w-5 sm:h-5 text-emerald-600" />
              </div>
              <div>
                <div className="text-sm font-semibold text-neutral-900 leading-tight">Ask Sanjeevani AI</div>
                <div className="text-[11px] sm:text-xs text-neutral-400 font-inter truncate max-w-[210px] sm:max-w-none">
                  Grounded in CanSupport Clinical Protocol & 14 Programs
                </div>
              </div>
            </div>
            <span className="text-[10px] sm:text-xs font-inter font-medium text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-200/60 whitespace-nowrap">
              Active RAG
            </span>
          </div>

          {/* Chat Messages */}
          <div className="flex-1 overflow-y-auto p-3.5 sm:p-6 space-y-3 sm:space-y-4">
            {messages.map((msg, i) => (
              <div key={i} className={`flex ${msg.role === "user" ? "justify-end" : "justify-start"}`}>
                <div
                  className={`max-w-[88%] sm:max-w-[80%] rounded-2xl p-3.5 sm:p-4 text-sm leading-relaxed ${
                    msg.role === "user"
                      ? "bg-neutral-900 text-white font-sans rounded-br-none"
                      : "bg-[#f7f7f5] text-neutral-800 font-sans rounded-bl-none border border-neutral-200/60"
                  }`}
                >
                  <div className="whitespace-pre-wrap">{msg.text}</div>

                  {msg.sources && msg.sources.length > 0 && (
                    <div className="mt-3 pt-2 border-t border-neutral-200/60 text-xs font-inter space-y-1">
                      <div className="font-semibold text-neutral-500 uppercase tracking-wider text-[10px]">
                        Verified Clinical Sources:
                      </div>
                      {msg.sources.map((src, sIdx) => (
                        <div key={sIdx} className="text-neutral-600 flex items-center gap-1.5">
                          <span className="w-1 h-1 rounded-full bg-emerald-600"></span>
                          <span>{src.title || src}</span>
                        </div>
                      ))}
                    </div>
                  )}

                  {msg.isEscalated && (
                    <div className="mt-3.5 p-3.5 bg-rose-50 border border-rose-200/80 rounded-xl text-xs font-inter flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-rose-950 shadow-xs">
                      <div className="flex items-start sm:items-center gap-2.5">
                        <span className="w-2.5 h-2.5 rounded-full bg-rose-600 animate-ping flex-shrink-0 mt-0.5 sm:mt-0"></span>
                        <div>
                          <div className="font-bold text-rose-900 text-xs flex items-center gap-1.5">
                            <span>🚨 Case Escalated to Counsellor Dashboard</span>
                          </div>
                          <div className="text-neutral-600 text-[11px] mt-0.5">
                            {msg.triageTier} • <span className="font-semibold text-rose-700">EDS: {msg.eds}%</span>
                          </div>
                        </div>
                      </div>
                      {setActiveTab && (
                        <button
                          onClick={() => setActiveTab("triage")}
                          className="self-start sm:self-auto px-3.5 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-lg font-semibold text-[11px] transition shadow-xs whitespace-nowrap active:scale-95 flex items-center gap-1.5 cursor-pointer"
                        >
                          <span>Open Counsellor Triage Queue</span>
                          <span>&rarr;</span>
                        </button>
                      )}
                    </div>
                  )}
                </div>
              </div>
            ))}
            {loading && (
              <div className="flex justify-start">
                <div className="bg-[#f7f7f5] border border-neutral-200/60 rounded-2xl p-4 rounded-bl-none flex items-center gap-2">
                  <div className="w-2 h-2 rounded-full bg-emerald-600 animate-bounce"></div>
                  <div className="w-2 h-2 rounded-full bg-emerald-600 animate-bounce" style={{ animationDelay: "0.2s" }}></div>
                  <div className="w-2 h-2 rounded-full bg-emerald-600 animate-bounce" style={{ animationDelay: "0.4s" }}></div>
                </div>
              </div>
            )}
            <div ref={messagesEndRef} />
          </div>

          {/* Quick Prompts: Horizontal Scrolling Strip for Mobile */}
          {messages.length <= 2 && (
            <div className="px-3 sm:px-6 py-2 flex items-center gap-2 border-t border-neutral-100 bg-neutral-50/40 overflow-x-auto no-scrollbar flex-nowrap flex-shrink-0">
              {prompts.map((p, pIdx) => (
                <button
                  key={pIdx}
                  onClick={() => sendMessage(p)}
                  className="text-xs font-inter text-neutral-600 bg-white border border-neutral-200/80 px-3 py-1.5 rounded-full hover:bg-neutral-100 active:scale-95 transition whitespace-nowrap flex-shrink-0 shadow-xs"
                >
                  {p}
                </button>
              ))}
            </div>
          )}

          {/* Message Input Bar */}
          <div className="p-2.5 sm:p-4 border-t border-neutral-200/80 bg-white flex items-center gap-2 sm:gap-3 flex-shrink-0">
            <input
              type="text"
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && sendMessage()}
              placeholder="Ask about symptoms, chemo, diet, or support..."
              className="flex-1 text-sm border border-neutral-200 rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-neutral-400 font-sans transition"
            />
            <button
              onClick={() => sendMessage()}
              disabled={!input.trim() || loading}
              className="w-10 h-10 rounded-xl bg-neutral-900 text-white flex items-center justify-center hover:bg-neutral-800 active:scale-95 transition disabled:opacity-40 flex-shrink-0"
              title="Send message"
            >
              <Icons.Send className="w-4 h-4" />
            </button>
          </div>
        </div>
      );
    }

    // ==============================================================================
    // VIEW 4: COUNSELLOR TRIAGE & ESCALATION DASHBOARD
    // ==============================================================================
    function CounsellorTriageView() {
      const [queue, setQueue] = useState([]);
      const [loading, setLoading] = useState(false);
      const [authKey, setAuthKey] = useState("sanjeevani-counsellor-demo-2026");

      const fetchQueue = async () => {
        setLoading(true);
        try {
          const apiBase = window.location.protocol === 'file:' ? 'http://localhost:8000' : '';
          const res = await fetch(apiBase + "/v1/counsellor/queue", {
            headers: { "X-Counsellor-Key": authKey }
          });
          if (res.ok) {
            const data = await res.json();
            setQueue(data.cases || []);
          }
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchQueue();
      }, []);

      const resolveCase = async (id) => {
        try {
          const apiBase = window.location.protocol === 'file:' ? 'http://localhost:8000' : '';
          await fetch(apiBase + "/v1/counsellor/resolve", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Counsellor-Key": authKey
            },
            body: JSON.stringify({
              case_id: id,
              counsellor_name: "Senior Clinical Counsellor",
              resolution_notes: "Completed tele-counseling stabilization protocol."
            })
          });
          fetchQueue();
        } catch (err) {
          console.error(err);
        }
      };

      return (
        <div className="max-w-6xl mx-auto space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white border border-neutral-200/70 rounded-2xl p-4 sm:p-6 shadow-apple">
            <div>
              <h1 className="text-lg sm:text-xl font-semibold text-neutral-900 tracking-tight">
                Counsellor Priority Review & Escalation Queue
              </h1>
              <p className="text-xs sm:text-sm text-neutral-500 font-inter mt-1 leading-relaxed">
                Monitors patients flagged by Section 8 EDS algorithm (EDS &gt; 60%) requiring human clinical intervention.
              </p>
            </div>
            <button
              onClick={fetchQueue}
              className="self-start sm:self-auto text-xs font-inter font-medium text-neutral-600 bg-neutral-100 border border-neutral-200 px-3 py-1.5 rounded-lg hover:bg-neutral-200 active:scale-95 transition"
            >
              Refresh Queue
            </button>
          </div>

          <div className="bg-white border border-neutral-200/70 rounded-2xl shadow-apple overflow-hidden">
            <div className="px-4 sm:px-6 py-3 sm:py-4 border-b border-neutral-100 flex justify-between items-center bg-neutral-50/50">
              <span className="text-xs font-semibold uppercase tracking-wider text-neutral-500 font-inter">
                Active Cases ({queue.length})
              </span>
              <span className="text-[11px] sm:text-xs text-neutral-400 font-inter">Auto-sorted by severity</span>
            </div>

            {queue.length === 0 ? (
              <div className="p-8 sm:p-12 text-center text-neutral-400 text-sm font-inter">
                No pending escalation cases in the queue. All patients within healthy limits.
              </div>
            ) : (
              <div className="divide-y divide-neutral-100">
                {queue.map((item, idx) => (
                  <div key={idx} className="p-4 sm:p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 hover:bg-neutral-50/40 transition">
                    <div className="space-y-1 max-w-2xl w-full">
                      <div className="flex flex-wrap items-center gap-2">
                        <span className="font-mono text-xs font-bold text-neutral-700 bg-neutral-100 px-2 py-0.5 rounded">
                          {item.id}
                        </span>
                        <span className={`text-xs font-bold font-inter px-2 py-0.5 rounded-full ${
                          item.eds >= 80 ? "bg-rose-100 text-rose-800" : "bg-amber-100 text-amber-800"
                        }`}>
                          EDS: {item.eds}% (Level {item.level || (item.eds >= 80 ? 4 : 3)})
                        </span>
                        <span className="text-xs text-neutral-400 font-inter">
                          {item.city} • {item.hospital}
                        </span>
                      </div>
                      <div className="text-sm font-medium text-neutral-900 pt-1 leading-snug">
                        "{item.patient_query}"
                      </div>
                      {item.suggested_reply && (
                        <div className="mt-2 p-2.5 bg-neutral-50 border border-neutral-200/70 rounded-xl text-xs font-inter text-neutral-700">
                          <span className="font-semibold text-neutral-900">AI-Drafted Response: </span>
                          <span>{item.suggested_reply}</span>
                        </div>
                      )}
                      <div className="text-[11px] text-neutral-400 font-inter pt-1">
                        Timestamp: {item.timestamp}
                      </div>
                    </div>

                    <div className="w-full sm:w-auto self-end sm:self-center">
                      {item.status === "RESOLVED" ? (
                        <span className="inline-block text-xs font-inter text-emerald-700 font-semibold bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200">
                          Resolved
                        </span>
                      ) : (
                        <button
                          onClick={() => resolveCase(item.id)}
                          className="w-full sm:w-auto text-xs font-inter font-medium text-white bg-neutral-900 hover:bg-neutral-800 active:scale-95 px-4 py-2 rounded-xl transition shadow-sm"
                        >
                          Mark Resolved
                        </button>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==============================================================================
    // VIEW 5: PATIENT PROGRAMS & CLINICAL PATHWAYS (14 PROGRAMS)
    // ==============================================================================
    function ProgramsExplorerView() {
      const [programs, setPrograms] = useState([]);
      const [search, setSearch] = useState("");
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        setLoading(true);
        fetch("/v1/programs")
          .then(res => res.json())
          .then(data => {
            if (data && data.programs) setPrograms(data.programs);
          })
          .catch(err => console.error(err))
          .finally(() => setLoading(false));
      }, []);

      const filtered = programs.filter(p =>
        p.title.toLowerCase().includes(search.toLowerCase()) ||
        (p.category && p.category.toLowerCase().includes(search.toLowerCase())) ||
        (p.description && p.description.toLowerCase().includes(search.toLowerCase()))
      );

      return (
        <div className="max-w-6xl mx-auto space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-3 sm:gap-4 bg-white border border-neutral-200/70 rounded-2xl p-4 sm:p-6 shadow-apple">
            <div>
              <h1 className="text-lg sm:text-xl font-semibold text-neutral-900 tracking-tight">
                Verified Oncology Support Programs (14)
              </h1>
              <p className="text-xs sm:text-sm text-neutral-500 font-inter mt-1 leading-relaxed">
                Community care programs established by Sanjeevani – Life Beyond Cancer across India.
              </p>
            </div>
            <div className="relative w-full md:w-72">
              <Icons.Search className="w-4 h-4 absolute left-3 top-3 text-neutral-400" />
              <input
                type="text"
                value={search}
                onChange={e => setSearch(e.target.value)}
                placeholder="Search programs..."
                className="w-full text-xs border border-neutral-200 rounded-xl pl-9 pr-3 py-2.5 focus:outline-none focus:border-neutral-400 font-inter transition"
              />
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5 sm:gap-4">
            {filtered.map((prog, idx) => (
              <div key={idx} className="bg-white border border-neutral-200/70 rounded-2xl p-4 sm:p-5 shadow-apple flex flex-col justify-between space-y-4 hover:border-neutral-300 transition">
                <div className="space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-[10px] font-mono text-neutral-400 bg-neutral-100 px-2 py-0.5 rounded uppercase font-semibold">
                      {prog.id || `PROG-${idx + 1}`}
                    </span>
                    <span className="text-[11px] font-inter font-medium text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full">
                      {prog.category || "Care Pathway"}
                    </span>
                  </div>
                  <h3 className="font-semibold text-neutral-900 text-sm leading-snug">
                    {prog.title}
                  </h3>
                  <p className="text-xs text-neutral-600 font-inter leading-relaxed line-clamp-3">
                    {prog.description}
                  </p>
                </div>

                <div className="pt-3 border-t border-neutral-100 text-[11px] text-neutral-400 font-inter space-y-1">
                  <div>Eligibility: <span className="text-neutral-700 font-medium">{prog.eligibility || "Open to all cancer patients"}</span></div>
                  <div>Contact: <span className="text-neutral-700 font-medium">{prog.contact || "National Desk 8691000800"}</span></div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Render the React application
    ReactDOM.createRoot(document.getElementById("root")).render(<SanjeevaniApp />);

    // Progressive Web App (PWA) Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('[PWA] Sanjeevani Service Worker active with scope:', registration.scope);
          })
          .catch(err => {
            console.log('[PWA] Service Worker registration note:', err);
          });
      });
    }
  </script>
</body>
</html>
